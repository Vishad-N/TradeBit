services:
  - type: web
    name: tradebit-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run render:start
    healthCheckPath: /api/v1/health/live
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.18.0
      - key: NODE_ENV
        value: production

      # Neon pooled URL (host contains -pooler). Used by the running app.
      - key: DATABASE_URL
        sync: false
      # Neon direct URL (no -pooler). Used only for `prisma migrate deploy` on boot.
      - key: DATABASE_URL_UNPOOLED
        sync: false

      # Must equal the Railway value or every existing login token is invalidated.
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: FRONTEND_URL
        value: https://www.tradebitindia.com,https://tradebitindia.com,https://trade-bit.vercel.app

      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: Admin

      # File storage (Render's disk is wiped on deploy, so Cloudinary is required).
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

      - key: MAX_PDF_MB
        value: '50'
      - key: PAGE_RENDER_SCALE
        value: '1.8'
      - key: PAGE_JPEG_QUALITY
        value: '82'

      - key: MENTORSHIP_PRICE_USDT
        value: '499'
      - key: MENTORSHIP_WALLET_ADDRESS
        sync: false
      - key: MENTORSHIP_TEST_MODE
        value: 'false'
      - key: TELEGRAM_URL
        value: https://t.me/tradebitindia_Official
