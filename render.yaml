services:
  - type: web
    name: tradebit-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run render:start
    healthCheckPath: /api/v1/health/live
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.18.0
      - key: NODE_ENV
        value: production
      # Neon pooled URL (host contains -pooler). Used by the running app.
      - key: DATABASE_URL
        sync: false
      # Neon direct URL (no -pooler). Used only for `prisma migrate deploy` on boot.
      - key: DATABASE_URL_UNPOOLED
        sync: false
      # Must equal the Railway value or every existing login token is invalidated.
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      # Comma-separated frontend origins, e.g. https://tradebitindia.com,https://www.tradebitindia.com
      - key: FRONTEND_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: Admin
      # File storage (Render's disk is wiped on deploy; use Cloudinary or an S3 bucket).
      - key: CLOUDINARY_URL
        sync: false
      - key: MENTORSHIP_PRICE_USDT
        sync: false
      - key: MENTORSHIP_WALLET_ADDRESS
        sync: false
      - key: TELEGRAM_URL
        sync: false
