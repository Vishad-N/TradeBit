# Backup uptime bot: pings the Render API so the free instance does not spin down.
# Set the repo variable API_URL (Settings > Secrets and variables > Actions > Variables),
# e.g. https://tradebit-api.onrender.com
name: keep-alive
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.API_URL != '' }}
    steps:
      - run: curl -fsS --retry 3 --retry-delay 10 --max-time 90 "${{ vars.API_URL }}/api/v1/health/live"
